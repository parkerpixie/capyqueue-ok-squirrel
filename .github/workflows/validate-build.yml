name: Validate production build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-build.yml'
      - 'package.json'
      - 'index.html'
      - 'netlify.toml'
      - 'src/**'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'public/icon.svg'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
