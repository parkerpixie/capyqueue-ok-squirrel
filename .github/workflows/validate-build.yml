name: Validate production build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-build.yml'
      - 'package.json'
      - 'index.html'
      - 'netlify.toml'
      - 'src/**'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'public/icon.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - name: Save successful build receipt
        run: |
          printf 'Production build passed for commit %s\n' "$GITHUB_SHA" > build-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json build-validation.txt
          git commit -m "Record successful production build"
          git push
